name: CI build

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  schedule:
    # Daily 5am Australia/Brisbane time
    - cron: "0 19 * * *"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Labelled so the required check names don't change when the Go versions do
    name: test (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The go.mod floor
          - label: floor
            go-version: "1.26"
          - label: latest
            go-version: "1.27"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Same as the latest test entry; Renovate bumps both together
          go-version: "1.27"

      - name: Check go.mod and go.sum are tidy
        run: go mod tidy -diff

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  vulncheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Same as the latest test entry; Renovate bumps both together
          go-version: "1.27"

      # Fails only on vulnerable code the module actually reaches. Dependabot alerts cover the rest of the module
      # graph. The daily schedule means a newly published vulnerability fails this build without a code change.
      - name: Check for reachable vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
