name: CI build

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  schedule:
    # Daily 5am Australia/Brisbane time
    - cron: "0 19 * * *"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Labelled so the required check names don't change when the Go versions do
    name: test (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The go.mod floor
          - label: floor
            go-version: "1.26"
          - label: latest
            go-version: "1.27"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Same as the latest test entry; Renovate bumps both together
          go-version: "1.27"

      - name: Check go.mod and go.sum are tidy
        run: go mod tidy -diff

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  # From v2 onwards the module path must end in /vN, and Release Please never edits go.mod. This
  # stops a breaking-change commit from tagging a major that no module path can import.
  module-path:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # On Release Please's PR, the manifest holds the version it's about to tag, so the suffix must
      # match it exactly. Elsewhere it holds the last release, and the suffix may be one major ahead
      # so a /vN change can land before the release that tags it.
      - name: Check the module path matches the release version
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          mode=()
          if [[ $HEAD_REF == release-please--branches--main ]]; then mode=(--release); fi
          .github/scripts/check-module-path.sh "${mode[@]}" .release-please-manifest.json go.mod

  vulncheck:
    runs-on: ubuntu-latest

    steps:
      # Fails only on vulnerable code the module actually reaches. Dependabot alerts cover the rest of the module
      # graph. The daily schedule means a newly published vulnerability fails this build without a code change.
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
